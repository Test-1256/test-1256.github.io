<HTML>
<head>


<SCRIPT LANGUAGE="javascript"> 
<!-- hide from old browsers
function rootUpdate() 
{
	var browserName = navigator.appName; 
	var browserRealnum = navigator.appVersion; 
	var browserParsed = browserRealnum.substring (0,4);
	if (browserParsed == "3.0 ") 
		browserParsed = 3.0;

	// This block is here for no good reason... but with Javascript, especially 
	// that designed for old browsers, you don't touch this stuff.
	{
		if (browserName == "Netscape" && browserParsed < 4.06)
		{
			parent.window.self.frames["main"].location.href = "browser-upgrade.html";
		}
		else
		{
			parent.window.self.frames["subnav"].location.href = "netscape-installer.html";
			parent.window.self.frames["main"].location.href = "opening-movie.html";
		}
	}
}
// stop hiding -->
</script>

</head>

<body onLoad="rootUpdate()" bgcolor="#000033">

<TABLE width=100% height=90%>
<TR>
<TD align=center valign=center>
<IMG WIDTH=450 HEIGHT=24 SRC="images/pleasewait.gif">
</td>
</tr>
</table>

</body>



</html>
