<HTML>
<HEAD>
<TITLE>SpiralStar Applet</TITLE>
</HEAD>
<BODY BGCOLOR="#000000" TEXT="#FFFFFF" LINK="#FF0000" VLINK="#FF0000" ALINK="#FFFF66">
<center>
<p align=center>

<APPLET ARCHIVE="spiralstar.jar" CODE="spiralstar.class" WIDTH="200" HEIGHT="200">
<PARAM NAME="credits" VALUE="Applet by Fabio Ciucci (www.anfyteam.com)">
<PARAM NAME="regcode" VALUE="NO">
<PARAM NAME="reglink" VALUE="NO">
<PARAM NAME="regnewframe" VALUE="YES">
<PARAM NAME="regframename" VALUE="_blank">
<PARAM NAME="statusmsg" VALUE="SpiralStar">

<PARAM NAME="type" VALUE="SPIRAL&STAR">
<!-- Star params -->
<PARAM NAME="starBranchNb" VALUE="16">
<PARAM NAME="starRatio" VALUE="0.3">
<PARAM NAME="starRatioInc" VALUE="-0.25">
<PARAM NAME="starBgColor" VALUE="ff0000">
<PARAM NAME="starFgColor" VALUE="555555">
<PARAM NAME="starLeftInset" VALUE="50">
<PARAM NAME="starRightInset" VALUE="50">
<PARAM NAME="starTopInset" VALUE="50">
<PARAM NAME="starBottomInset" VALUE="50">
<PARAM NAME="starAnimType" VALUE="2">
<!-- Spiral params -->
<PARAM NAME="precis" VALUE="250">
<PARAM NAME="xLapsInit" VALUE="10.0">
<PARAM NAME="yLapsInit" VALUE="10.0">
<PARAM NAME="xLapsIncrement" VALUE="0.08">
<PARAM NAME="yLapsIncrement" VALUE="0.079">
<PARAM NAME="xRotationInit" VALUE="0.3">
<PARAM NAME="yRotationInit" VALUE="0.5">
<PARAM NAME="xRotationInc" VALUE="0.2">
<PARAM NAME="yRotationInc" VALUE="0.3">
<PARAM NAME="spiralLeftInset" VALUE="15">
<PARAM NAME="spiralRightInset" VALUE="15">
<PARAM NAME="spiralTopInset" VALUE="15">
<PARAM NAME="spiralBottomInset" VALUE="15">
<PARAM NAME="spiralBgColor" VALUE="00ffff">
<PARAM NAME="spiralFgColor" VALUE="ff00ff">
<PARAM NAME="spiralFocusBgColor" VALUE="ffff00">
<PARAM NAME="spiralFocusFgColor" VALUE="00ff00">
<PARAM NAME="cycleBgColor" VALUE="NO">
<PARAM NAME="cycleFgColor" VALUE="NO">
<PARAM NAME="spiralImage" VALUE="NO">
<!-- Background & foregournd images params -->
<PARAM NAME="backeffect" VALUE="kaleid">
<PARAM NAME="kalimage" VALUE="bubbles.jpg">
<PARAM NAME="kalspeed" VALUE="100">

<PARAM NAME="bgColor" VALUE="000000">
<PARAM NAME="bgImage" VALUE="no">
<PARAM NAME="expandBgImage" VALUE="NO">
<PARAM NAME="textured" VALUE="YES">
<PARAM NAME="image" VALUE="no">
<PARAM NAME="focusImage" VALUE="no">

<PARAM NAME="memdelay" value="1000">
<PARAM NAME="priority" value="3">
<PARAM NAME="MinSYNC" value="10">
<PARAM NAME="overimg" VALUE="NO">
<PARAM NAME="overimgX" VALUE="0">
<PARAM NAME="overimgY" VALUE="0">
Please <A HREF="http://www.anfyteam.com/java/">download Java(tm)</A>.
</APPLET></p>
