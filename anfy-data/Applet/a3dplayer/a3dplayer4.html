<HTML>
<HEAD>
   <TITLE>Anfy3d Player Applet</TITLE>
 </HEAD>

<BODY BGCOLOR="#000000" TEXT="#CCFFFF" VLINK="#CCCC00" ALINK="#FFFFCC" LINK="#FFFF33">

<CENTER>
  <P>
<applet archive="a3dplayer.jar" code="a3dplayer.class" width="500" height="300" MAYSCRIPT>
  <PARAM NAME="credits" VALUE="Applet by Andrea Fasce (www.anfyteam.com)">
  <PARAM NAME="regcode" VALUE="no">
  <PARAM NAME="reglink" VALUE="no">
  <PARAM NAME="regnewframe" VALUE="yes">
  <PARAM NAME="regframename" VALUE="_blank">
  <param name="scene" value="Stat.a3d">
  <param name="illumination" value="on">
  <param name="navigation" value="quake">
  <param name="xspeed" value="4">
  <param name="yspeed" value="2">
  <param name="zspeed" value="8">
  <param name="distance" value="20">
  <param name="avatarheight" value="14">
  <param name="a3dobject" value="SCENEGRAPH">
  <param name="zoom" value="off">
  <param name="forcetime" value="on">
  <param name="dynamic" value="off"> 
  <param name="logo" value="no">
  <param name="bgcolor" value="000000">
  <param name="loadbarcolor" value="ffffff">
  <param name="loadbarbgcolor" value="999999">
      Please <A HREF="http://www.anfyteam.com/java/">download Java(tm)</A>.
    </APPLET><br>
  <p><font color="#CCFFFF">Quake mode: use arrow keys and mouse to explore this 75Kb world.</font><br>
