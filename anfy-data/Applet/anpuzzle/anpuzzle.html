<body bgcolor ="#333333" text="#ffffff">
<center>
  <p><applet archive="anpuzzle.jar" code="anpuzzle.class" width="300" height="200">

      <PARAM NAME="regframename" VALUE="_blank">
      <param name="overimg" value="no">
      <param name="overimgX" value="10">
      <param name="overimgY" value="150">
      <PARAM NAME="res" VALUE="1">
      <PARAM NAME="memdelay" value="1000">
      <PARAM NAME="priority" value="3">
      <PARAM NAME="MinSYNC" value="10">

      <param name=textscroll value="anpuzzlescr.txt">

      <param name=textitalic value="NO">

      <param name=TextColB value="220">
      <param name=TextSColR value="20">
      <param name=TextSColG value="20">
      <param name=TextSColB value="50">

      <param name=TextSineAmp value="0">
      <param name=TextSineSpd value="0">

      <PARAM NAME="fontSize" value="14">
      <PARAM NAME="fontType" value="Helvetica">

      <param name="bgImage" value="back.jpg">
      <PARAM NAME="bgColor" value="000000">
      <param name="tilesX" value="5">
      <param name="tilesY" value="4">
      <param name="shadow" value="true">
      <param name="puzzleImage1" value="image1.jpg">
      <param name="puzzleImage2" value="image2.jpg">
      <param name="puzzleImage3" value="image3.jpg">
      <param name="puzzleImage4" value="image4.jpg">

      <param name="xOffset" value="30">
      <param name="yOffset" value="30">
