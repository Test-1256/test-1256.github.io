<body bgcolor="#FFFFFF" text="#000000">
<center>
<img src="http://www.smbhq.com/trivia/logo.gif" alt=""><br>
<p><h1>Yoshi's Island DS Quiz</h1></p>
<p><!--This a comment and all comments may be deleted without problems to the applet.-->
<!--version 1.1.0 parameters-->
<applet name="QuizMaster" code="QuizMaster.class" archive="http://www.smbhq.com/trivia/QuizMaster.jar" codebase="http://www.smbhq.com/trivia/" width="800" height="600">

<!--If you register this applet you will receive the registered jar file, which will remove the link back to us and any unregistered messages.-->
<param name="java_version" value="1.8.0_181">
<param name="separate_jvm" value="true">

<param name="QuizFile" value="questions/yids.txt"><!--The data file that contains the questions, answers, picture names, explanations,...-->
<param name="FileEncoding" value="standard"><!--The encoding of the data file. It can be set to standard (default) or Unicode. If you want to be able to use Chinese, Greek or other non-Latin characters (this text uses Latin characters) put it to Unicode and encode your quiz file in Unicode.-->

<param name="ShowAnswersStatus" value="AtEnd"><!--This sets if and when the answers should be shown. It can be set to "AtEnd" (default), "AfterEachQuestion" and "Not".-->
<param name="ShowRestartQuizButton" value="Yes"><!--If this is "Yes" or "True" then there will be a button shown to restart the quiz at the end of the quiz.-->
<param name="NumberOfColumns" value="1"><!--The number of columns for the possible ansers.-->

<!--Tags, used for translating the applet-->
<param name="TagLoadingApplet" value="Loading RealApplets quiz... Please wait."><!--The tag when loading in beginning-->
<param name="TagLoadingQuestion" value="Loading Question... Please wait."><!--The tag when loading a question-->
<param name="TagLoadingSolution" value="Calculating score... Please wait."><!--The tag when loading a question-->

<param name="TagCorrect" value="Your answer is correct!"><!--Added in front of the explanation of the solution when they answered the question correct-->
<param name="TagWrong" value="Your answer is wrong!"><!--Added in front of the explanation of the solution when they answered the question wrong-->

<param name="TagShowSolution" value="View solutions"><!--The tag of the button to show the solutions. Only used when ShowAnswerStatus is "AtEnd"-->
<param name="TagNextSolution" value="Next solution"><!--The tag of the button to show the next solution. Only used when ShowAnswerStatus is "AtEnd"-->
<param name="TagNextQuestion" value="Next question"><!--The tag of the button to ask the next question. Only used when ShowAnswerStatus is "AfterEachQuestion-->
<param name="TagRestartQuiz" value="Take the quiz again"><!--The tag of the button to restart the quiz-->
<!--End tag parameters-->

<!--Skin parameters configured to skin 3-->
<param name="BackgroundSkinFile" value="backgroundskinfile.png"><!--the background picture-->
<param name="ButtonSkinFile" value="buttonskinfile3.jpg"><!--the picture that has the buttons skins etc.-->
<param name="BackgroundColor" value="003366"><!--the color of the background when loading-->

<param name="QuestionColor" value="FFFFFF"><!--the color of a question-->
<param name="QuestionFontStyle" value="Arial"><!--the style of font of a question-->
<param name="QuestionFontSize" value="18"><!--the size of font of a question-->

<param name="AnswerColorOut" value="FFFFFF"><!--the color of an answers when the mouse is not over that answer-->
<param name="AnswerColorOver" value="CC9933"><!--the color of an answer when the mouse is over that answer-->
<param name="AnswerColorSolution" value="FFCC66"><!--the color an answer that is the solution to the question when the solution is shown-->
<param name="AnswerFontStyle" value="TimesRoman"><!--the style of font of an answer-->
<param name="AnswerFontSize" value="14"><!--the size of font of an answer-->

<param name="ExplanationColorCorrect" value="FFCC66"><!--the color of the explanation of the solution when the answer was correct-->
<param name="ExplanationColorWrong" value="FFCC66"><!--the color of the explanation of the solution when the answer was wrong-->
<param name="ExplanationFontStyle" value="Ariel"><!--the style of font of the explanation-->
<param name="ExplanationFontSize" value="16"><!--the size of font of the explanation-->

<param name="ScoreColor" value="FFFFFF"><!--the color of the result-->
<param name="ScoreFontStyle" value="TimesRoman"><!--the style of font of the result-->
<param name="ScoreFontSize" value="30"><!--the size of font of the result-->

<param name="ButtonColorOut" value="FFFFFF"><!--the color of the button text when the mouse is not over that button-->
<param name="ButtonColorOver" value="FFCC66"><!--the color of the button text when the mouse is over that button-->

<param name="TextXPosition" value="300"><!--This is the X coordinate on where to start placing questions, etc. It depends on your skin and if you use pictures.-->
<param name="TextYPosition" value="140"><!--This is the Y coordinate on where to start placing questions, etc. It depends on your skin and if you use pictures.-->
<param name="TextMaxWidth" value="300"><!--This is the maximum width of the questions. If it goes over that, a new line is taken. It also is used for the ansers, but subtracted by 30.-->
<param name="ImageXPosition" value="10"><!--This is the X coordinate on where to start placing question images. It depends on your skin and if you use pictures.-->
<param name="ImageYPosition" value="10"><!--This is the Y coordinate on where to start placing question images. It depends on your skin and if you use pictures.-->
<param name="ButtonsXPosition" value="380"><!--This is the X coordinate of the top left corner of the lowest button. It depends on your skin and if you use pictures.-->
<param name="ButtonsYPosition" value="550"><!--This is the Y coordinate of the top left corner of the lowest button. It depends on your skin and if you use pictures.-->
<!--End skin parameters-->
Java is not enabled: to solve your Java problems, please take a look at the help section of <a href="http://www.realapplets.com/">RealApplets.com</a>.<br>

</applet></p>
