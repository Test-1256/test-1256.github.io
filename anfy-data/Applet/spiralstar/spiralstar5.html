<HEAD>
<TITLE>SpiralStar Applet</TITLE>

<BODY BGCOLOR="#000000" background="fire.gif" TEXT="#FFFFFF" LINK="#0000FF" VLINK="#000000" ALINK="#FFFF66">
<center>
<p align=center>

<APPLET ARCHIVE="spiralstar.jar" CODE="spiralstar.class" WIDTH="300" HEIGHT="300">
<PARAM NAME="credits" VALUE="Applet by Fabio Ciucci (www.anfyteam.com)">
<PARAM NAME="regcode" VALUE="NO">
<PARAM NAME="reglink" VALUE="NO">
<PARAM NAME="regnewframe" VALUE="YES">
<PARAM NAME="regframename" VALUE="_blank">
<PARAM NAME="statusmsg" VALUE="SpiralStar">

<PARAM NAME="type" VALUE="SPIRAL&STAR">
<!-- Star params -->
<PARAM NAME="starBranchNb" VALUE="20">
<PARAM NAME="starRatio" VALUE="0.2">
<PARAM NAME="starRatioInc" VALUE="-0.2">
<PARAM NAME="starBgColor" VALUE="FF0000">
<PARAM NAME="starFgColor" VALUE="00FF00">
<PARAM NAME="starLeftInset" VALUE="60">
<PARAM NAME="starRightInset" VALUE="60">
<PARAM NAME="starTopInset" VALUE="60">
<PARAM NAME="starBottomInset" VALUE="60">
<PARAM NAME="starAnimType" VALUE="2">
<!-- Spiral params -->
<PARAM NAME="precis" VALUE="250">
<PARAM NAME="xLapsInit" VALUE="10.0">
<PARAM NAME="yLapsInit" VALUE="10.0">
<PARAM NAME="xLapsIncrement" VALUE="0.08">
<PARAM NAME="yLapsIncrement" VALUE="0.078">
<PARAM NAME="xRotationInit" VALUE="0.0">
<PARAM NAME="yRotationInit" VALUE="0.0">
<PARAM NAME="xRotationInc" VALUE="0.0">
<PARAM NAME="yRotationInc" VALUE="0.0">
<PARAM NAME="spiralLeftInset" VALUE="35">
<PARAM NAME="spiralRightInset" VALUE="35">
<PARAM NAME="spiralTopInset" VALUE="35">
<PARAM NAME="spiralBottomInset" VALUE="35">
<PARAM NAME="spiralBgColor" VALUE="0000ff">
<PARAM NAME="spiralFgColor" VALUE="no">
<PARAM NAME="spiralFocusBgColor" VALUE="0000ff">
<PARAM NAME="spiralFocusFgColor" VALUE="000000">
<PARAM NAME="cycleBgColor" VALUE="YES">
<PARAM NAME="cycleFgColor" VALUE="NO">
<PARAM NAME="spiralImage" VALUE="no">
<!-- Background & foregournd images params -->
<PARAM NAME="bgColor" VALUE="000000">
<PARAM NAME="bgImage" VALUE="fire.gif">
<PARAM NAME="expandBgImage" VALUE="NO">
<PARAM NAME="textured" VALUE="YES">
<PARAM NAME="image" VALUE="no">
<PARAM NAME="focusImage" VALUE="no">
<!-- Scrolltext params  -->
<param name=overtext value="NO">
<param name=textscroll value="NO">
<param name=texttype value="vertical">
<param name=textvspace value="10">
<param name=textminfont value="8">
<param name=textmaxfont value="172">
<param name=textoffset value="120">
<param name=textspeed value="1">
<param name=textfont value="Courier">
<param name=textbold value="NO">
<param name=textitalic value="NO">
<param name=textsize value="18">
<param name=textshadow value="NO">
<param name=TextColR value="250">
<param name=TextColG value="250">
<param name=TextColB value="250">
<param name=TextSColR value="20">
<param name=TextSColG value="20">
<param name=TextSColB value="50">
<param name=TextJumpAmp value="0">
<param name=TextJumpSpd value="0">
<param name=TextSineAmp value="0">
<param name=TextSineSpd value="0">
<param name=TextSineAngle value="3">

<PARAM NAME="memdelay" value="1000">
<PARAM NAME="priority" value="3">
<PARAM NAME="MinSYNC" value="10">
<PARAM NAME="overimg" VALUE="NO">
<PARAM NAME="overimgX" VALUE="0">
<PARAM NAME="overimgY" VALUE="0">
Please <A HREF="http://www.anfyteam.com/java/">download Java(tm)</A>.
